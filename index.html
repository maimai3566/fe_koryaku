<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FE万紫千紅 - 主人公別 スカウト・加入条件まとめ</title>
  <link rel="stylesheet" href="style.css?v=20261104_v8">
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <header>
    <div class="title-row">
      <div>
        <h1>⚔️ FE 万紫千紅 - 主人公別 スカウト・加入条件</h1>
        <div class="subtitle">カイ / ディートリヒ / セオドラ / レダ の4主人公比較マトリクス</div>
      </div>
      <div class="action-btns">
        <span class="hit-count" id="hitCount">-- 件</span>
        <button class="btn" onclick="resetToLatestData()" title="初期データに更新">🔄 リセット</button>
        <button class="btn" onclick="exportData()">💾 バックアップ</button>
        <button class="btn" onclick="importData()">📂 復元</button>
        <button class="btn btn-primary" onclick="openAddModal()">＋ キャラ追加</button>
      </div>
    </div>

    <!-- 表示モード切替（メインタブ） -->
    <div class="view-mode-tabs">
      <button class="mode-btn active" data-mode="char" onclick="setViewMode('char')">📋 キャラ別 詳細表</button>
      <button class="mode-btn" data-mode="fame" onclick="setViewMode('fame')">👑 名声別 早見一覧</button>
      <button class="mode-btn" data-mode="support" onclick="setViewMode('support')">💖 支援別 早見一覧</button>
    </div>

    <!-- コントロールバー -->
    <div class="controls">
      <!-- 検索 -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="キャラ名・条件で検索..." oninput="filterTable()">
      </div>

      <!-- ルート表示切替タブ（キャラ別詳細表でのみ表示） -->
      <div class="route-tabs" id="routeTabs">
        <button class="tab-btn active" data-route="all" onclick="setRouteFilter('all')">全主人公 比較</button>
        <button class="tab-btn" data-route="kai" onclick="setRouteFilter('kai')">カイ篇</button>
        <button class="tab-btn" data-route="dietrich" onclick="setRouteFilter('dietrich')">ディートリヒ篇</button>
        <button class="tab-btn" data-route="theodora" onclick="setRouteFilter('theodora')">セオドラ篇</button>
        <button class="tab-btn" data-route="leda" onclick="setRouteFilter('leda')">レダ篇</button>
      </div>

      <!-- 未加入フィルター & スリム化 -->
      <div class="filter-options">
        <label>
          <input type="checkbox" id="unjoinedOnly" onchange="filterTable()">
          未加入のみ表示
        </label>
        <label>
          <input type="checkbox" id="compactMode" onchange="toggleCompactMode()">
          スリム化
        </label>
      </div>
    </div>
  </header>

  <!-- テーブルエリア -->
  <div class="table-container">
    <table id="charTable">
      <thead id="charTableHead">
        <!-- JSで動的レンダリング -->
      </thead>
      <tbody id="charTableBody">
        <!-- JSで動的レンダリング -->
      </tbody>
    </table>
  </div>

  <div class="footer-note">
    💡 <strong>Tips:</strong> 「👑 名声別 早見一覧」「💖 支援別 早見一覧」では、縦軸にレベル・横軸に4人の主人公が並び、該当キャラが一覧表示されます！キャラ名をタップするとそのルートの加入状態（加入済✔ / 未加入）を切り替えられます。
  </div>
</div>

<!-- キャラ追加・編集モーダル -->
<div class="modal-overlay" id="addModal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">＋ 新規キャラクター追加</div>
    <input type="hidden" id="editCharId" value="">
    <div class="form-group">
      <label>キャラクター名</label>
      <input type="text" id="formName" placeholder="例: 新キャラクター">
    </div>

    <div style="font-size: 0.85rem; font-weight: 700; color: var(--accent-gold); margin: 12px 0 6px;">各ルートの加入条件</div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <!-- カイ -->
      <div style="background: rgba(56, 189, 248, 0.05); padding: 8px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.2);">
        <div style="color: var(--accent-kai); font-weight: 700; font-size: 0.8rem; margin-bottom: 4px;">カイ篇</div>
        <input type="text" id="formKaiSupport" placeholder="支援Lv (例: 2, 初期)" style="margin-bottom:4px;">
        <input type="text" id="formKaiFame" placeholder="名声Lv (例: 3, -)" style="margin-bottom:4px;">
        <input type="text" id="formKaiCond" placeholder="加入条件" style="margin-bottom:4px;">
        <input type="text" id="formKaiLimit" placeholder="期限 (例: 1部12章)">
      </div>

      <!-- ディートリヒ -->
      <div style="background: rgba(249, 115, 22, 0.05); padding: 8px; border-radius: 6px; border: 1px solid rgba(249, 115, 22, 0.2);">
        <div style="color: var(--accent-dietrich); font-weight: 700; font-size: 0.8rem; margin-bottom: 4px;">ディートリヒ篇</div>
        <input type="text" id="formDietrichSupport" placeholder="支援Lv" style="margin-bottom:4px;">
        <input type="text" id="formDietrichFame" placeholder="名声Lv" style="margin-bottom:4px;">
        <input type="text" id="formDietrichCond" placeholder="加入条件" style="margin-bottom:4px;">
        <input type="text" id="formDietrichLimit" placeholder="期限">
      </div>

      <!-- セオドラ -->
      <div style="background: rgba(168, 85, 247, 0.05); padding: 8px; border-radius: 6px; border: 1px solid rgba(168, 85, 247, 0.2);">
        <div style="color: var(--accent-theodora); font-weight: 700; font-size: 0.8rem; margin-bottom: 4px;">セオドラ篇</div>
        <input type="text" id="formTheodoraSupport" placeholder="支援Lv" style="margin-bottom:4px;">
        <input type="text" id="formTheodoraFame" placeholder="名声Lv" style="margin-bottom:4px;">
        <input type="text" id="formTheodoraCond" placeholder="加入条件" style="margin-bottom:4px;">
        <input type="text" id="formTheodoraLimit" placeholder="期限">
      </div>

      <!-- レダ -->
      <div style="background: rgba(236, 72, 153, 0.05); padding: 8px; border-radius: 6px; border: 1px solid rgba(236, 72, 153, 0.2);">
        <div style="color: var(--accent-leda); font-weight: 700; font-size: 0.8rem; margin-bottom: 4px;">レダ篇</div>
        <input type="text" id="formLedaSupport" placeholder="支援Lv" style="margin-bottom:4px;">
        <input type="text" id="formLedaFame" placeholder="名声Lv" style="margin-bottom:4px;">
        <input type="text" id="formLedaCond" placeholder="加入条件" style="margin-bottom:4px;">
        <input type="text" id="formLedaLimit" placeholder="期限">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeAddModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveCharacter()">保存する</button>
    </div>
  </div>
</div>

<!-- スクリプト読み込み -->
<script src="data.js?v=20261104_v8"></script>
<script src="app.js?v=20261104_v8"></script>
</body>
</html>
